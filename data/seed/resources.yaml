- id: r_bank_official
  country: IN
  category: bank_guidance
  name_en: Bank Official Fraud Hotline
  name_hi: बैंक की आधिकारिक धोखाधड़ी हेल्पलाइन
  contact_type: none
  contact_value: ""
  description_en: Dial the official customer care number printed strictly on the back of your debit/credit card or inside your official mobile banking app. Never use numbers from web search results or SMS messages.
  description_hi: केवल अपने डेबिट/क्रेडिट कार्ड के पीछे छपे या आधिकारिक मोबाइल बैंकिंग ऐप में दिए गए नंबर पर ही कॉल करें। इंटरनेट सर्च या SMS के नंबरों पर कभी भरोसा न करें।
  when_to_use_en: Immediately block your compromised cards, net banking, or UPI handle, and report unauthorized debits.
  when_to_use_hi: तुरंत अपने प्रभावित कार्ड, नेट बैंकिंग या UPI को ब्लॉक करने और अनधिकृत लेनदेन दर्ज कराने के लिए।
  triggers_json: '{"incident_any":["upi_payment","card_details_shared","bank_transfer","otp_shared","remote_app_installed"],"money_lost":true,"time_since_any":["just_now","within_1h","today"],"min_priority_bump":0}'
  priority: 15
