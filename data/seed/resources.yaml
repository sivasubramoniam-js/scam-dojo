- id: r_1930
  country: IN
  category: helpline
  name_en: National Cyber Crime Helpline (1930)
  name_hi: राष्ट्रीय साइबर अपराध हेल्पलाइन (1930)
  contact_type: phone
  contact_value: "1930"
  description_en: Dedicated 24/7 national helpline by the Ministry of Home Affairs to immediately freeze financial fraud transactions during the golden hour.
  description_hi: गृह मंत्रालय की 24/7 राष्ट्रीय हेल्पलाइन, जो वित्तीय धोखाधड़ी के तुरंत बाद पैसे को ब्लॉक कराने में मदद करती है।
  when_to_use_en: Call immediately (within 1-2 hours) if money has been deducted from your bank, UPI, or card.
  when_to_use_hi: यदि आपके बैंक, UPI या कार्ड से धोखाधड़ी से पैसे कट गए हैं, तो तुरंत (1-2 घंटे के भीतर) कॉल करें।
  triggers_json: '{"incident_any":["upi_payment","card_details_shared","bank_transfer"],"money_lost":true,"time_since_any":["just_now","within_1h","today"],"min_priority_bump":0}'
  priority: 10
  source_url: https://cybercrime.gov.in
  verified_on: "2026-10-14"
  active: 1

