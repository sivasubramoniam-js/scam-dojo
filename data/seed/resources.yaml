- id: r_selfhelp_credentials
  country: IN
  category: identity
  name_en: Immediate Account Lockdown Guide
  name_hi: त्वरित खाता सुरक्षा निर्देश
  contact_type: none
  contact_value: ""
  description_en: "Step-by-step actions: (1) Uninstall remote management apps (AnyDesk, TeamViewer); (2) Turn on Airplane mode temporarily if phone was compromised; (3) Reset main email and banking passwords from another trusted device; (4) Revoke active sessions."
  description_hi: "आवश्यक सुरक्षा कदम: (1) स्क्रीन शेयरिंग ऐप तुरंत हटाएँ; (2) यदि फ़ोन पर नियंत्रण का शक हो तो अस्थायी रूप से एयरप्लेन मोड लगाएँ; (3) किसी अन्य सुरक्षित डिवाइस से ईमेल और बैंक पासवर्ड बदलें।"
  when_to_use_en: Essential self-protection whenever remote access apps were installed or passwords/OTPs were leaked.
  when_to_use_hi: जब भी कोई रिमोट एक्सेस ऐप इंस्टॉल किया गया हो या पासवर्ड/OTP लीक हो गया हो।
  triggers_json: '{"incident_any":["otp_shared","remote_app_installed"],"money_lost":false,"time_since_any":["just_now","within_1h","today"],"min_priority_bump":0}'
  priority: 12
