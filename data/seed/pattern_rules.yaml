- id: 1
  kind: shortener
  lang: any
  pattern: 'https?:\/\/(?:bit\.ly|tinyurl\.com|t\.co|is\.gd|cutt\.ly|rb\.gy|goo\.gl|tiny\.cc)\/[A-Za-z0-9_-]+'
  tag: shortener_url
  weight: 2
  note: URL shortener masking true destination

- id: 2
  kind: keyword
  lang: en
  pattern: '(?i)\b(?:expires?\s+today|within\s+20\s+mins?|account\s+blocked|suspended\s+immediately|immediate\s+action\s+required|urgent\s+kyc)\b'
  tag: urgency
  weight: 2
  note: Urgency keyword in English

- id: 3
  kind: keyword
  lang: hi
  pattern: '(?i)(?:आज\s+ही\s+बंद|तुरंत\s+ब्लॉक|20\s+मिनट\s+में|जल्द\s+से\s+जल्द|तत्काल\s+अपडेट)'
  tag: urgency
  weight: 2
  note: Urgency keyword in Hindi

- id: 4
  kind: keyword
  lang: any
  pattern: '(?i)\b(?:enter\s+pin\s+to\s+receive|approve\s+collect|claim\s+refund|receive\s+₹|scan\s+qr\s+to\s+get|पिन\s+दर्ज\s+करें)\b'
  tag: upi_pull_scam
  weight: 3
  note: Collect request or entering PIN to receive money

- id: 5
  kind: keyword
  lang: any
  pattern: '(?i)\b(?:share|send|forward|give|provide|tell|enter|type|input|verify|submit|email)\b(?:\s+\w+){0,3}\s+\b(?:otp|one[- ]*time\s*password|pin|mpin|cvv|secret\s*code|passcode)\b|\b(?:ओटीपी|पिन)\s*(?:बताएं|शेयर|भेजें|दर्ज\s*करें)\b'
  tag: otp_request
  weight: 4
  note: Requesting to share, forward, or enter sensitive OTP or authentication code

- id: 6
  kind: remote_app
  lang: any
  pattern: '(?i)\b(?:anydesk|teamviewer|rustdesk|quicksupport|screen\s*share|apk\s+download)\b'
  tag: remote_app
  weight: 3
  note: Screen sharing or remote desktop application

- id: 7
  kind: keyword
  lang: any
  pattern: '(?i)\b(?:digital\s+arrest|cbi\s+investigation|customs\s+seizure|narcotics\s+bureau|police\s+warrant|मनी\s+लॉन्ड्रिंग)\b'
  tag: digital_arrest
  weight: 3
  note: Impersonating law enforcement / digital arrest

- id: 8
  kind: keyword
  lang: any
  pattern: '(?i)\b(?:safe\s+account|verification\s+account|govt\s+reserve\s+account|सरकारी\s+खाते\s+में)\b'
  tag: safe_account
  weight: 3
  note: Directing funds to a purported 'safe account'

- id: 9
  kind: keyword
  lang: any
  pattern: '(?i)\b(?:daily\s+profit|guaranteed\s+returns?|like\s+and\s+subscribe\s+to\s+earn|₹[0-9]+\s+per\s+task|recharge\s+to\s+withdraw)\b'
  tag: job_task_scam
  weight: 2
  note: Part time work from home / task trap

- id: 10
  kind: phish
  lang: any
  pattern: '(?i)@(?:gmall|gmaill|gmai1|gamil|yaho0|yaho|hotmial|outl0ok|paytmm|sbi-verify|hdfc-bank|icic1)\.(?:com|in|org|net|online|site|top|work)\b|https?:\/\/[^\s]*(?:gmall|gmaill|yaho0|hotmial)\.com'
  tag: typosquatting_domain
  weight: 4
  note: "Typo-squatted lookalike domain detected ('gmall.com' instead of 'gmail.com'). Scammers misspell trusted service domains to deceive users."

- id: 11
  kind: authority
  lang: any
  pattern: '(?i)\b(?:hdfc|sbi|icici|axis|kotak|pnb|bob|canara|indusind|yesbank|rbi|cbi|police|customs|income[- ]*tax|cybercell|cybercrime)[a-z0-9._-]*@(?:gmail|yahoo|hotmail|outlook|rediffmail|proton|icloud|gmall|gmaill|yaho0)\.com\b'
  tag: bank_public_webmail
  weight: 4
  note: "Bank or government authority impersonation on public or typo-squatted webmail. Legitimate banks only communicate from official corporate domains (e.g. @hdfcbank.com)."

- id: 12
  kind: phish
  lang: any
  pattern: '(?i)\b(?:otp|pin|credentials?|password)\b(?:\s+\w+){0,5}\s+(?:to\s+(?:this\s+)?(?:secured\s+)?email|via\s+email|to\s+email|on\s+email)\b'
  tag: credential_email_harvest
  weight: 4
  note: "Direct credential harvesting: asking to send an OTP or security code to an email address is fraud. Banks never collect OTPs via email."

- id: 13
  kind: trust
  lang: any
  pattern: '(?i)\b(?:secured\s+email|official\s+verification\s+desk|safe\s+escrow|rbi\s+approved\s+server|anti[- ]fraud\s+portal)\b'
  tag: fake_security_assurance
  weight: 3
  note: "False claim of 'secured email' or 'official verification desk' designed to induce false trust."
