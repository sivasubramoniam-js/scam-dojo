[project]
name = "scam-dojo-api"
version = "0.1.0"
description = "Scam Dojo FastAPI and Google ADK Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "aiosqlite>=0.20.0",
    "google-adk>=2.12.0",
    "google-genai>=2.30.1",
    "jinja2>=3.1.4",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
